name: Build & Test

on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check modernize
        run: |
          go run golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@latest -fix ./...
          git diff --exit-code

      - name: Build
        run: go build ./cmd/artifact-fs

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  fuse-e2e:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up FUSE
        run: |
          sudo apt-get update
          sudo apt-get install --yes fuse3
          if [ ! -e /dev/fuse ]; then
            sudo modprobe fuse
          fi
          test -c /dev/fuse
          sudo chmod 666 /dev/fuse

      - name: FUSE end-to-end tests
        env:
          AFS_RUN_E2E_TESTS: "1"
        run: |
          go test -c -o "$RUNNER_TEMP/artifact-fs-e2e.test" .
          sudo --preserve-env=AFS_RUN_E2E_TESTS "$RUNNER_TEMP/artifact-fs-e2e.test" \
            -test.count=1 \
            -test.run '^TestFUSEMountSmoke$' \
            -test.timeout=2m \
            -test.v
          sudo --preserve-env=AFS_RUN_E2E_TESTS "$RUNNER_TEMP/artifact-fs-e2e.test" \
            -test.count=1 \
            -test.run '^TestE2E' \
            -test.timeout=20m \
            -test.v

  container-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/cloudflare-sandbox-sdk/package-lock.json

      - name: Check example documentation
        run: |
          test "$(wc -l < examples/README.md)" -lt 50
          test "$(wc -l < examples/cloudflare-sandbox-sdk/README.md)" -lt 50

      - name: Build generic container
        run: docker build --file examples/Dockerfile .

      - name: Check Cloudflare Sandbox example
        working-directory: examples/cloudflare-sandbox-sdk
        run: |
          npm ci
          npm run typecheck
          package_version="$(node -p "require('./package.json').devDependencies['@cloudflare/sandbox']")"
          image_version="$(sed -n 's#^FROM docker.io/cloudflare/sandbox:\([^ ]*\)$#\1#p' Dockerfile)"
          test "$package_version" = "$image_version"
          npx wrangler deploy --dry-run --outdir /tmp/artifact-fs-sandbox-dry-run
